<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration | Le Prestige Vins et Spiritueux</title>

<link rel="stylesheet" href="admin-v2.css">

</head>

<body>

<header class="header-admin">

    <img
        src="logo.png"
        alt="Logo Le Prestige Vins et Spiritueux"
        class="logo-admin">

    <div class="titre-admin">

        <h1>
            LE PRESTIGE
            <br>
            Vins et Spiritueux
        </h1>

        <p>
            Tableau de bord Administrateur
        </p>

    </div>

</header>

<div class="container">

    <form id="formProduit" class="formulaire">

        <h2>➕ Ajouter un produit</h2>

        <input
            type="file"
            id="photo"
            accept="image/*">

        <img
            id="imagePreview"
            class="preview"
            style="display:none;">

        <input
            type="text"
            id="nom"
            placeholder="Nom du produit">

        <select id="categorie">

            <option value="">Choisir une catégorie</option>

            <option value="vin">Vin</option>
            <option value="champagne">Champagne</option>
            <option value="whisky">Whisky</option>
            <option value="cognac">Cognac</option>
            <option value="rhum">Rhum</option>
            <option value="liqueur">Liqueur</option>
            <option value="gin">Gin</option>
            <option value="vodka">Vodka</option>

        </select>

        <textarea
            id="description"
            placeholder="Description du produit"></textarea>

        <input
            type="number"
            id="prixAchat"
            placeholder="Prix d'achat">

        <input
            type="number"
            id="ancienPrix"
            placeholder="Ancien prix (Promo)">

        <input
            type="number"
            id="prixVente"
            placeholder="Prix de vente">

        <input
            type="number"
            id="stock"
            placeholder="Stock disponible">

        <select id="badge">

            <option value="">Aucun badge</option>

            <option value="PROMO">🔥 PROMO</option>

            <option value="NOUVEAU">🆕 NOUVEAU</option>

        </select>

        <button
            type="button"
            id="btnAjouter"
            class="btn-save">

            💾 Enregistrer le produit

        </button>

    </form>

    <section class="gestion">

        <h2>📦 Gestion des produits</h2>

        <input
            type="search"
            id="recherche"
            placeholder="🔍 Rechercher un produit...">

        <table>

            <thead>

                <tr>

                    <th>Photo</th>
                    <th>Produit</th>
                    <th>Catégorie</th>
                    <th>Prix Achat</th>
                    <th>Prix Vente</th>
                    <th>Stock</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="listeProduits">

            </tbody>

        </table>

    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="admin-v2.js"></script>

</body>

</html>
