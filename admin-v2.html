<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration - Le Prestige</title>

<link rel="stylesheet" href="admin-mobile.css">

</head>

<body>

<header>

<h1>🍷 Le Prestige</h1>

<p>Administration des produits</p>

</header>

<div class="container">

<div class="formulaire">

<h2>Ajouter un produit</h2>

<input type="file" id="photo" accept="image/*">

<img id="imagePreview">

<input type="text" id="nom" placeholder="Nom du produit">

<select id="categorie">

<option value="vin">Vin</option>

<option value="champagne">Champagne</option>

<option value="whisky">Whisky</option>

<option value="rhum">Rhum</option>

<option value="liqueur">Liqueur</option>

<option value="gin">Gin</option>

<option value="vodka">Vodka</option>

</select>

<textarea
id="description"
placeholder="Description">
</textarea>

<input
type="number"
id="prixAchat"
placeholder="Prix d'achat">

<input
type="number"
id="ancienPrix"
placeholder="Ancien prix (optionnel)">

<input
type="number"
id="prixVente"
placeholder="Prix de vente">

<input
type="number"
id="stock"
placeholder="Stock">

<select id="badge">

<option value="">Aucun badge</option>

<option value="NOUVEAU">🆕 Nouveau</option>

<option value="PROMO">🔥 Promo</option>

<option value="BEST">⭐ Best Seller</option>

</select>

<button id="btnAjouter">

➕ Ajouter le produit

</button>

</div>

<div class="gestion">

<h2>Gestion du stock</h2>

<input
type="search"
id="recherche"
placeholder="Rechercher un produit...">

<table>

<thead>

<tr>

<th>Produit</th>

<th>Achat</th>

<th>Vente</th>

<th>Stock</th>

<th>Marge</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="listeProduits">

</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="admin-mobile.js"></script>

</body>

</html>
